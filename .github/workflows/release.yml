name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 校验 tag 与 manifest 版本一致
        run: node -e 'const m=require("./manifest.json");const t=process.env.GITHUB_REF_NAME;if(m.version!==t){console.error("拒绝发版：tag 是 "+t+"，manifest.json 里的 version 是 "+m.version);process.exit(1);}console.log("版本一致："+t);'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 构建
        run: npm run build

      - name: 校验构建产物
        run: |
          set -e
          for f in main.js manifest.json styles.css; do
            if [ ! -s "$f" ]; then echo "缺少构建产物：$f"; exit 1; fi
          done
          ls -l main.js manifest.json styles.css
          node -e 'const m=require("./manifest.json");if(m.id!=="fleur-pdf"){console.error("产物 id 不对： "+m.id);process.exit(1);}console.log("产物 id 正确："+m.id);'

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
          --notes "Adds selection lookup & translation parity with FleurEPUB: word -> dictionary popup (FleurDict bridge or built-in Youdao/FreeDictionary fallback, phonetics, pronunciation, AI explain, wordbook); sentence -> translation with AI follow-up. New standalone wordbook with optional FleurDict sync and cross-device sync (visible vault file FleurPDF/data). Desktop handwriting mode (mouse inking) promoted from debug preview, with cross-device ink sync via a visible FleurPDF/data/ink copy (tombstone merge). New camera tool in ink mode: region screenshot with text extraction (PDF text layer / local tesseract OCR, opt-in / vision model) and ask-AI on the captured image. Fixes settings-page scroll jump, erased strokes resurrecting during ink sync, and aligns the 4+4 annotation menu grid. Local OCR engine files (worker + WASM kernel, Apache-2.0, version-pinned) are downloaded on demand only when the user enables local OCR, then cached in the plugin folder." \
            --latest
